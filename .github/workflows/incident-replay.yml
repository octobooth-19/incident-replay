name: Incident replay

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Private issue number with a reviewed replay input (blank runs the fictional demo)'
        type: string
        required: false
      publish_demo_pages:
        description: 'Publish the fictional checkout-api demo to GitHub Pages'
        type: boolean
        required: true
        default: false
      assign_copilot:
        description: 'Assign Copilot to a private, reviewed handoff issue using the supplied evidence'
        type: boolean
        required: true
        default: false
      handoff_issue_number:
        description: 'Open, reviewed private issue to assign to Copilot (only when opted in)'
        type: string
        required: false

permissions: {}

jobs:
  replay:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'workflow_dispatch' || github.event.label.name == 'incident')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Generate the replay and issue comment offline
        run: node src/generate-replay.cjs --workflow "$RUNNER_TEMP/incident-replay" "$GITHUB_REPOSITORY"
      - name: Post the generated sanitized comment
        if: github.event_name == 'issues' || inputs.issue_number != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node src/post-comment.cjs "$RUNNER_TEMP/incident-replay/issue-comment.md"
      - name: Upload downloadable replay
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: incident-replay
          path: ${{ runner.temp }}/incident-replay/
          if-no-files-found: error
          retention-days: 7
      - name: Assign Copilot to the reviewed handoff issue
        if: github.event_name == 'workflow_dispatch' && inputs.assign_copilot
        env:
          COPILOT_ASSIGNMENT_TOKEN: ${{ secrets.COPILOT_ASSIGNMENT_TOKEN }}
        run: node src/assign-copilot.cjs --workflow "$RUNNER_TEMP/incident-replay/issue-comment.md"

  publish-demo-pages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_demo_pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Generate only the fictional demo site
        run: |
          node src/generate-replay.cjs --demo "$RUNNER_TEMP/incident-replay"
          mkdir -p site
          cp "$RUNNER_TEMP/incident-replay/index.html" "$RUNNER_TEMP/incident-replay/replay.json" site/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
